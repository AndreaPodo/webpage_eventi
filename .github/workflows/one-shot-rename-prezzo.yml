name: One-shot rename Excel header

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-rename-prezzo.yml"

permissions:
  contents: write

jobs:
  rename-header:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Rename only the prezzo header in the workbook
        shell: bash
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          import xml.etree.ElementTree as ET
          import tempfile, os

          path = Path("spettacoli.xlsx")
          if not path.is_file():
              raise SystemExit("spettacoli.xlsx not found")

          NS = "http://schemas.openxmlformats.org/spreadsheetml/2006/main"
          ET.register_namespace("", NS)
          q = lambda tag: f"{{{NS}}}{tag}"
          tmp = path.with_suffix(".tmp.xlsx")
          changed = False

          with ZipFile(path, "r") as zin:
              names = set(zin.namelist())
              sheet_name = "xl/worksheets/sheet1.xml"
              if sheet_name not in names:
                  raise SystemExit("Expected first worksheet XML not found")
              sheet = ET.fromstring(zin.read(sheet_name))
              sst = ET.fromstring(zin.read("xl/sharedStrings.xml")) if "xl/sharedStrings.xml" in names else None
              strings = []
              if sst is not None:
                  for si in sst.findall(q("si")):
                      strings.append("".join((t.text or "") for t in si.iter(q("t"))))

              rows = sheet.findall(f".//{q('row')}")
              first = next((row for row in rows if row.attrib.get("r") == "1"), None)
              if first is None:
                  raise SystemExit("Header row not found")

              target = None
              for cell in first.findall(q("c")):
                  typ = cell.attrib.get("t")
                  if typ == "s":
                      v = cell.find(q("v"))
                      if v is not None and v.text is not None:
                          idx = int(v.text)
                          value = strings[idx] if idx < len(strings) else ""
                      else:
                          value = ""
                  elif typ == "inlineStr":
                      value = "".join((t.text or "") for t in cell.iter(q("t")))
                  else:
                      v = cell.find(q("v"))
                      value = v.text if v is not None and v.text else ""
                  if value.strip().casefold() == "prezzo":
                      target = cell
                      break
                  if value.strip() == "Prezzo":
                      target = "already"
                      break

              if target == "already":
                  print("Header is already Prezzo; no workbook change required.")
              elif target is None:
                  raise SystemExit("No header cell named 'prezzo' found; workbook left unchanged.")
              else:
                  typ = target.attrib.get("t")
                  if typ == "s":
                      if sst is None:
                          raise SystemExit("Shared string table missing")
                      v = target.find(q("v"))
                      new_si = ET.SubElement(sst, q("si"))
                      new_t = ET.SubElement(new_si, q("t"))
                      new_t.text = "Prezzo"
                      v.text = str(len(strings))
                      if "uniqueCount" in sst.attrib:
                          sst.attrib["uniqueCount"] = str(int(sst.attrib["uniqueCount"]) + 1)
                      changed = True
                      sst_bytes = ET.tostring(sst, encoding="utf-8", xml_declaration=True)
                  elif typ == "inlineStr":
                      t = target.find(f".//{q('t')}")
                      if t is None:
                          raise SystemExit("Inline header text node missing")
                      t.text = "Prezzo"
                      changed = True
                  else:
                      v = target.find(q("v"))
                      if v is None:
                          raise SystemExit("Header value node missing")
                      v.text = "Prezzo"
                      changed = True

              if changed:
                  sheet_bytes = ET.tostring(sheet, encoding="utf-8", xml_declaration=True)
                  with ZipFile(tmp, "w") as zout:
                      for info in zin.infolist():
                          data = zin.read(info.filename)
                          if info.filename == sheet_name:
                              data = sheet_bytes
                          elif info.filename == "xl/sharedStrings.xml" and sst is not None:
                              data = sst_bytes
                          zout.writestr(info, data)

          if changed:
              if tmp.exists():
                  os.replace(tmp, path)
              with ZipFile(path, "r") as check:
                  bad = check.testzip()
                  if bad:
                      raise SystemExit(f"Corrupt XLSX ZIP member: {bad}")
                  check_sst = ET.fromstring(check.read("xl/sharedStrings.xml")) if "xl/sharedStrings.xml" in check.namelist() else None
                  check_sheet = ET.fromstring(check.read(sheet_name))
                  check_strings = []
                  if check_sst is not None:
                      for si in check_sst.findall(q("si")):
                          check_strings.append("".join((t.text or "") for t in si.iter(q("t"))))
                  row = next(row for row in check_sheet.findall(f".//{q('row')}") if row.attrib.get("r") == "1")
                  headers = []
                  for cell in row.findall(q("c")):
                      if cell.attrib.get("t") == "s":
                          headers.append(check_strings[int(cell.find(q("v")).text)])
                      elif cell.attrib.get("t") == "inlineStr":
                          headers.append("".join((t.text or "") for t in cell.iter(q("t"))))
                      else:
                          v = cell.find(q("v"))
                          headers.append(v.text if v is not None else "")
                  if "Prezzo" not in headers or "prezzo" in headers:
                      raise SystemExit("Post-write header validation failed")
              print("Validated: only the header label was changed to Prezzo.")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/one-shot-rename-prezzo.yml
          git add spettacoli.xlsx .github/workflows/one-shot-rename-prezzo.yml
          if ! git diff --cached --quiet; then
            git commit -m "Rename prezzo header to Prezzo"
            git push origin main
          else
            echo "No changes to commit."
          fi
